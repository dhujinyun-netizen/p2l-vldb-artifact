# Base evaluation template for diagnostic and legacy scripts.
# This is not the final paper configuration. Use
# configs/structnar/final_p2l_d3_rqc_cosine_w20.yaml for the reported method.
# Official M-BEIR evaluation config for GPT-HDGR generator.
# Data/task/candidate/qrel/metric mapping follows the GENIUS M-BEIR protocol.
# The only intended method change is the generation-side model: GPT-HDGR instead of GENIUS_t5small.
codebook_config:
  codebook_level: 8
  codebook_vocab: 4096
  quantizer_path: checkpoint/rq_clip_large/Large/Instruct/InBatch/rq_clip_large_epoch_50.pth

data_config:
  cand_pool_dir_name: cand_pool/local
  enable_query_instruct: true
  extracted_dir: extracted_embed/CLIP_SF/cand
  image_size: 224, 224
  in_batch_neg_num: 0
  is_extracted: true
  auto_fallback_to_raw_if_missing_extracted: false
  auto_align_candidate_pool: false
  query_instruct_path: instructions/query_instructions.tsv
  shuffle_cand: true
  # Diagnostic switch for batch-invariance tests. False preserves the official
  # GENIUS/M-BEIR random-instruction evaluation protocol.
  deterministic_eval_sampling: false
  test_dir_name: query/test
  train_dir_name: query/train
  union_cand_pool_dir_name: cand_pool/global
  val_dir_name: query/val

dataloader_config:
  batch_size: 16
  num_workers: 4

dist_config:
  dist_url: env://

experiment:
  description: ${model.name} ${model.size} ${experiment.instruct_status} ${experiment.exp_name}
  exp_name: structnar_base_all32
  instruct_status: Instruct
  path_suffix: ${model.short_name}/${model.size}/${experiment.instruct_status}/${experiment.exp_name}/

model:
  generator_type: gpt_hdgr
  use_t5_tokenizer: false
  time_step: 8
  guidance_scale: 3.0
  cond_drop_prob: 0.1
  temperature: 1.0
  top_p: 1.0
  d_model: 512
  ckpt_config:
    ckpt_dir: checkpoint/code_tied
    ckpt_name: gpt_hdgr_best_R_at_1.pth
  clip_vision_model_name: ViT-L/14
  gather_embeddings: true
  name: GPTHDGRBackboneRetriever
  pretrained_clip_model_dir: checkpoint/CLIP/
  pretrained_config:
    pretrained_dir: checkpoint/CLIP_SF
    pretrained_name: clip_sf_large.pth
    using_pretrained: true
  short_name: STRUCTNAR
  gpt_hdgr_hierarchy_aware_blocks: false
  use_tcis: false
  hierarchy_aware_blocks: false
  hierarchy_block_sizes: [9]
  hierarchy_block_names: [full_code]
  gpt_hdgr_block_diffusion_steps: 8
  gpt_hdgr_block_score_normalization: mean
  block_trie_max_candidates: 0
  deduplicate_block_beams: true
  size: Large
  trie_type: trie_cpp
  num_prefix: 30
  diversity_strength: 0.0
  delayed_diversity_start: 2
  nar_num_layers: 6
  nar_num_heads: 8
  nar_dropout: 0.1
  gpt_hdgr_block_size: 1
  hdgr_num_layers: 6
  hdgr_num_heads: 8
  hdgr_dropout: 0.1
  use_time_embedding: true
  init_rq_codebook_embeddings: true
  codebook_init_scale: 100.0
  query_positive_mix_prob: 1.0
  query_positive_mix_alpha: 2.0
  query_positive_mix_elementwise: true
  prefix_suffix_noising_prob: 0.0
  visible_token_loss_weight: 0.1
  loss_normalization: global
  beam_score_normalization: none
  training_objective: masked_ce
  hdgr_code_tied_output_head: true
  hdgr_tied_checkpoint_merge: average
  use_rrg: false
  rrg_weight: 0.0
  rrg_normalize: true
  rrg_skip_modality: true

